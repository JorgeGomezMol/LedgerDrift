[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ledgerdrift"
version = "0.1.0"
description = "Open detection of silent data corruption in automated integrations between operational platforms and accounting systems"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Jorge Gómez Molina" }]
requires-python = ">=3.10"
dependencies = ["pandas>=2.0", "numpy>=1.24", "scikit-learn>=1.3"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
ledgerdrift = "ledgerdrift.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
